[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/application",
    "crates/db-postgres",
    "crates/db-sqlite",
    "crates/db-mysql",
    "crates/db-clickhouse",
    "crates/export-local",
    "crates/export-s3",
    "crates/llm-anthropic",
    "crates/llm-openai",
    "crates/llm-ollama",
    "crates/storage",
    "crates/ui-egui",
    "crates/app",
    "crates/test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
# Smaller binaries for distribution; thin LTO keeps build times reasonable.
lto = "thin"
strip = true
