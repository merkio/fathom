[package]
name = "storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
domain = { path = "../domain" }
application = { path = "../application" }
async-trait = "0.1"
rusqlite = { version = "0.43", features = ["bundled"] }
secrecy = "0.10"
uuid = "1"

# The `v1` feature (default) picks the platform credential store: Keychain on macOS, Credential
# Manager on Windows, the Secret Service (pure Rust, over D-Bus) on Linux.
keyring = "4"

[dev-dependencies]
futures = "0.3"
tempfile = "3"
test-support = { path = "../test-support" }
