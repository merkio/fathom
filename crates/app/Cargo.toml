llm-ollama = { path = "../llm-ollama" }
llm-openai = { path = "../llm-openai" }
ui-egui = { path = "../ui-egui" }
anyhow = "1"
directories = "6"
futures = "0.3"
secrecy = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
