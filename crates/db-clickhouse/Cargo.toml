[package]
name = "db-clickhouse"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Integration tests against a real ClickHouse server (env vars). Off by default.
integration = []

[dependencies]
domain = { path = "../domain" }
application = { path = "../application" }
async-trait = "0.1"
secrecy = "0.10"
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
# The official ClickHouse client (HTTP interface). TLS through rustls with the ring provider
# and the platform's root certificates, like the other adapters.
clickhouse = { version = "0.15", default-features = false, features = ["rustls-tls-ring", "rustls-tls-native-roots"] }

[dev-dependencies]
test-support = { path = "../test-support" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
