[package]
name = "db-mysql"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Integration tests against a real MySQL/MariaDB (env vars or testcontainers). Off by default.
integration = []
containers = ["integration", "dep:testcontainers-modules"]

[dependencies]
domain = { path = "../domain" }
application = { path = "../application" }
async-trait = "0.1"
futures = "0.3"
secrecy = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "mysql", "bigdecimal", "chrono", "json"] }
tokio = { version = "1", features = ["time", "sync"] }
testcontainers-modules = { version = "0.15", features = ["mysql", "mariadb"], optional = true }

[dev-dependencies]
test-support = { path = "../test-support" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
