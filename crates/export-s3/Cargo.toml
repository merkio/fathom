[package]
name = "export-s3"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Integration tests against a real or emulated S3 endpoint (env vars). Off by default.
integration = []

[dependencies]
domain = { path = "../domain" }
application = { path = "../application" }
async-trait = "0.1"
secrecy = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time"] }
# The official AWS SDK for Rust. Default features are off so TLS uses rustls with the ring
# provider (set up explicitly below), like the other adapters, instead of the aws-lc C library.
aws-sdk-s3 = { version = "1", default-features = false, features = ["http-1x", "rt-tokio", "behavior-version-latest"] }
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "credentials-process", "sso", "behavior-version-latest"] }
aws-smithy-http-client = { version = "1", features = ["rustls-ring"] }

[dev-dependencies]
test-support = { path = "../test-support" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
