name: CI

# Checks every branch push and pull request: formatting, lints, tests, coverage, integration tests
# against real databases and dependency audits. Also reusable: the release workflow calls it, so a
# tag only produces a release when everything is green.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Weekly, to catch newly published advisories in dependencies even without new commits.
    - cron: "17 5 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  lint:
    name: Lint (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # All features, so code behind the integration/containers feature flags is linted too.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # Unit tests plus the database integration tests, so the adapters are measured too.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        env:
          CLICKHOUSE_PASSWORD: test
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FATHOM_TEST_CLICKHOUSE_HOST: 127.0.0.1
      FATHOM_TEST_CLICKHOUSE_PASSWORD: test
      FATHOM_TEST_PG_HOST: 127.0.0.1
      FATHOM_TEST_PG_PASSWORD: postgres
      FATHOM_TEST_MYSQL_HOST: 127.0.0.1
      FATHOM_TEST_MYSQL_USER: root
      FATHOM_TEST_MYSQL_PASSWORD: test
      FATHOM_TEST_MYSQL_DB: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # egui drawing code (views) and the binary's main() are not unit-testable without a display;
      # they are excluded so the number reflects the logic that can be tested.
      - name: Collect coverage
        run: >-
          cargo llvm-cov --workspace --locked
          --features db-postgres/integration,db-mysql/integration,db-clickhouse/integration
          --ignore-filename-regex '(crates/ui-egui/src/views/|crates/app/src/main\.rs|/tests/)'
          --lcov --output-path lcov.info
      - name: Summary
        run: |
          {
            echo "### Coverage"
            echo '```'
            cargo llvm-cov report --summary-only --ignore-filename-regex '(crates/ui-egui/src/views/|crates/app/src/main\.rs|/tests/)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  postgres-integration:
    name: Integration (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        image: ["postgres:18", "postgres:16"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FATHOM_TEST_PG_HOST: 127.0.0.1
      FATHOM_TEST_PG_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p db-postgres --features integration --locked

  mysql-integration:
    name: Integration (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        image: ["mysql:8.4", "mysql:9", "mariadb:11"]
    runs-on: ubuntu-latest
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest || mariadb-admin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FATHOM_TEST_MYSQL_HOST: 127.0.0.1
      FATHOM_TEST_MYSQL_USER: root
      FATHOM_TEST_MYSQL_PASSWORD: test
      FATHOM_TEST_MYSQL_DB: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p db-mysql --features integration --locked

  clickhouse-integration:
    name: Integration (clickhouse:${{ matrix.tag }})
    strategy:
      fail-fast: false
      matrix:
        tag: [latest, "25.8"]  # 25.8 is an LTS release
    runs-on: ubuntu-latest
    services:
      db:
        image: clickhouse/clickhouse-server:${{ matrix.tag }}
        env:
          CLICKHOUSE_PASSWORD: test
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FATHOM_TEST_CLICKHOUSE_HOST: 127.0.0.1
      FATHOM_TEST_CLICKHOUSE_PASSWORD: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p db-clickhouse --features integration --locked

  audit:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Advisories, licences, banned and unknown sources, as configured in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Catches platform-specific build problems early. Informational until it has been seen green on
  # all systems; then remove `continue-on-error`.
  cross-platform-build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p app --locked
